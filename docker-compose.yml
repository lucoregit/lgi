version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgi-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - lgi-data:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=h2
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/api/posts || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lgi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  lgi-data:

